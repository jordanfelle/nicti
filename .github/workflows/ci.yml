name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    name: cargo fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    name: cargo clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      # #68/ADR-0006's pelt-egui/pelt-iced/pelt-slint spikes pull in winit's Linux backends
      # (X11/Wayland) plus Slint's Skia/FemtoVG renderers. Precautionary, NOT independently
      # confirmed as required: a local sandbox build succeeded with none of these packages
      # installed (winit dlopen's libX11/libwayland/libxkbcommon/libGL at runtime rather than
      # linking them -- `readelf -d` on the resulting binaries shows no NEEDED entries for any
      # of them), so a real ubuntu-latest CI run may not need this step at all. Left in
      # defensively since this PR couldn't exercise actual GitHub Actions runners to confirm
      # either way. If CI passes without it, remove this step in a follow-up; if CI fails to
      # link, check its error for the missing .so and adjust the list to match.
      - run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev libwayland-dev libx11-dev libxi-dev libxrandr-dev libgl1-mesa-dev libfontconfig1-dev
      # --workspace: `nicti`'s root manifest is both a workspace root and a real package
      # (not a virtual manifest), so a bare `cargo clippy` without `-p`/`--workspace` only
      # checks the root `nicti` crate and silently skips spikes/* and bench/whisker
      # entirely (verified locally: `cargo clippy --all-targets --all-features` alone
      # reports "Checking nicti" only, nothing else). Same fix cargo-deny's job already
      # needed for the same reason (see its own comment below).
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings

  test:
    name: cargo test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      # See the clippy job's comment above -- same #68/ADR-0006 GUI-toolkit link dependency.
      - run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev libwayland-dev libx11-dev libxi-dev libxrandr-dev libgl1-mesa-dev libfontconfig1-dev
      # --workspace: see the clippy job's comment above -- without it, pawprint's and
      # sheath's tests silently never ran in CI.
      - run: cargo test --workspace --all-targets --all-features

  cargo-deny:
    name: cargo deny (licenses)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2
        with:
          command: check licenses
          # cargo-deny only resolves the root package's deps by default; --workspace pulls in
          # spikes/* and bench/whisker too (verified locally: without it, only `nicti` itself
          # shows up in `cargo deny list`). --all-features is the action's own default -- keep it
          # explicit since setting `arguments` overrides rather than appends to that default.
          arguments: --workspace --all-features

  build-windows:
    name: cargo build (windows, v1 target)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      # -p nicti, not a bare workspace build: spikes/* are throwaway
      # research crates (see CLAUDE.md's package map section), not part of
      # the shipping v1 target, and shouldn't ride along in the release
      # build that validates it.
      - run: cargo build --release -p nicti

name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    name: cargo fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    name: cargo clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      # #68/ADR-0006's pelt-egui/pelt-iced/pelt-slint spikes pull in winit's Linux backends
      # (X11/Wayland) plus Slint's Skia/FemtoVG renderers. Precautionary, NOT independently
      # confirmed as required: a local sandbox build succeeded with none of these packages
      # installed (winit dlopen's libX11/libwayland/libxkbcommon/libGL at runtime rather than
      # linking them -- `readelf -d` on the resulting binaries shows no NEEDED entries for any
      # of them), so a real ubuntu-latest CI run may not need this step at all. Left in
      # defensively since this PR couldn't exercise actual GitHub Actions runners to confirm
      # either way. If CI passes without it, remove this step in a follow-up; if CI fails to
      # link, check its error for the missing .so and adjust the list to match.
      - run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev libwayland-dev libx11-dev libxi-dev libxrandr-dev libgl1-mesa-dev libfontconfig1-dev
      # --workspace: `nicti`'s root manifest is both a workspace root and a real package
      # (not a virtual manifest), so a bare `cargo clippy` without `-p`/`--workspace` only
      # checks the root `nicti` crate and silently skips spikes/* and bench/whisker
      # entirely (verified locally: `cargo clippy --all-targets --all-features` alone
      # reports "Checking nicti" only, nothing else). Same fix cargo-deny's job already
      # needed for the same reason (see its own comment below).
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings

  test:
    name: cargo test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      # See the clippy job's comment above -- same #68/ADR-0006 GUI-toolkit link dependency.
      - run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev libwayland-dev libx11-dev libxi-dev libxrandr-dev libgl1-mesa-dev libfontconfig1-dev
      # --workspace: see the clippy job's comment above -- without it, pawprint's and
      # sheath's tests silently never ran in CI.
      #
      # --exclude den, added for #113's `libsql` engine: a blanket `--all-features` here would
      # activate `den`'s `sqlite` and `libsql` features together in the SAME feature resolution,
      # and (unlike `cargo clippy --all-features`, which only type-checks and never reached the
      # final link step -- confirmed by running it, not assumed) `cargo test` actually links
      # `den`'s bin/test binaries, which fails: `rusqlite`'s bundled `libsqlite3-sys` and
      # `libsql`'s bundled `libsql-ffi` both statically compile a full copy of real SQLite's C
      # symbols, and linking both into one binary is a genuine `multiple definition of
      # sqlite3_prepare_v3` (etc.) error, not a flaky one -- reproduced directly against this exact
      # command before adding the exclusion. `den` gets its own two feature-scoped commands below
      # instead, the same pattern the Windows job's own `-p den` line already uses.
      - run: cargo test --workspace --all-targets --all-features --exclude den
      - run: cargo test -p den --features sqlite,duckdb,lmdb,turso,redb,rocksdb,fjall
      - run: cargo test -p den --no-default-features --features libsql,duckdb,lmdb,turso

  cargo-deny:
    name: cargo deny (licenses)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2
        with:
          command: check licenses
          # cargo-deny only resolves the root package's deps by default; --workspace pulls in
          # spikes/* and bench/whisker too (verified locally: without it, only `nicti` itself
          # shows up in `cargo deny list`). --all-features is the action's own default -- keep it
          # explicit since setting `arguments` overrides rather than appends to that default.
          arguments: --workspace --all-features

  build-windows:
    name: cargo build (windows, v1 target)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      # -p nicti, not a bare workspace build: spikes/* are throwaway
      # research crates (see CLAUDE.md's package map section), not part of
      # the shipping v1 target, and shouldn't ride along in the release
      # build that validates it.
      - run: cargo build --release -p nicti
      # Dylib loading (DLL_PREFIX/DLL_SUFFIX, LoadLibrary semantics) is platform-specific, and
      # Windows is the v1 target -- the Linux `test` job alone isn't enough coverage for
      # nicti-claw's C-ABI dylib boundary (ADR-0004 section 4).
      - run: cargo test -p nicti-claw -p dewclaw
      # #115/ADR-0015's RocksDB candidate: `librocksdb-sys` generates its FFI bindings with
      # `bindgen`, which needs libclang on the build machine. GitHub's `windows-latest` runner
      # ships an msys64 install whose own `libclang.dll` conflicts with the one bindgen needs
      # (confirmed against `rust-rocksdb/rust-rocksdb`'s own upstream CI, which carries this exact
      # workaround for this exact reason -- not a guess). Removing it and installing LLVM via
      # choco mirrors that upstream recipe precisely rather than inventing a different fix.
      - name: Remove msys64 (bindgen/libclang conflict, RocksDB build)
        run: Remove-Item -LiteralPath "C:\msys64\" -Force -Recurse -ErrorAction SilentlyContinue
      - name: Install LLVM (bindgen/libclang, RocksDB build)
        run: choco install llvm -y
      # #67/ADR-0008's Windows hard gate (plus #102/ADR-0009's Turso, #106/ADR-0010's redb,
      # #115/ADR-0015's RocksDB, and #116/ADR-0016's fjall follow-ups): each catalog-database-engine
      # candidate must build and pass its cross-engine correctness test on the actual v1 target, not
      # just Linux -- this is exactly the gate that eliminated pglite-rs (its build.rs passes a
      # Unix-only linker flag, confirmed unrunnable here) before a Windows CI job ever had to prove
      # it. `-p den` only (not `--workspace`): den is a spike, same reasoning as the `-p nicti` build
      # above. `redb` was missing from this list even after ADR-0010 merged (a real gap, fixed while
      # resolving an earlier merge, not by either side's own diff) -- it, `rocksdb`, and `fjall` all
      # combine fine with `sqlite` (none bundles a competing SQLite C fork), so all three join the
      # main command below; mirrors the Linux `test` job's already-validated command.
      - run: cargo test -p den --features sqlite,duckdb,lmdb,turso,redb,rocksdb,fjall
      # #113's libSQL candidate needs its own, separate step: `rusqlite`'s bundled
      # `libsqlite3-sys` and `libsql`'s bundled `libsql-ffi` both statically link a full copy of
      # real SQLite's C symbols into the same `den` binary, which fails at the final link step
      # with `multiple definition of sqlite3_prepare_v3` (etc.) if both features are enabled
      # together -- confirmed locally, not assumed. `duckdb`/`lmdb`/`turso` don't bundle a real
      # sqlite3.c (DuckDB is its own engine; LMDB and Turso Database don't touch SQLite's C code
      # at all), so they combine with `libsql` here without the same clash.
      - run: cargo test -p den --no-default-features --features libsql,duckdb,lmdb,turso

name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # den (#117): rejected-engine code (turso/redb/libsql/rocksdb/fjall) is path-gated out of
    # per-PR CI below since none of it ships -- this weekly run is what catches it silently
    # rotting (a toolchain/dependency update breaking a candidate nobody's touching) between
    # den-touching PRs. pelt (#127): the pelt-egui/pelt-iced/pelt-slint GUI-framework spikes are
    # path-gated the same way and for the same reason -- this run also catches those rotting
    # between pelt-touching PRs.
    - cron: '0 6 * * 1'
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # #117: drops Rust debuginfo, and (since cargo sets DEBUG=false for build scripts at debug=0,
  # but not at any nonzero level including line-tables-only) also makes den's bundled C/C++ native
  # builds (DuckDB, RocksDB, rusqlite/libsql's SQLite forks) compile without -g. This was the bulk
  # of the multi-GB Windows/clippy rust-cache entries that were pushing this repo over GitHub's
  # 10GB per-repo cache limit (confirmed via `gh cache list` before this change: 7.2GB Windows +
  # 2x2GB clippy = 11.2GB, with the `test` job's own cache entry already evicted). Panic locations
  # and backtraces still work -- they don't depend on debuginfo, only on symbol names.
  CARGO_PROFILE_DEV_DEBUG: 0

jobs:
  changes:
    name: detect den changes
    runs-on: ubuntu-latest
    outputs:
      den: ${{ steps.filter.outputs.den }}
      pelt: ${{ steps.filter.outputs.pelt }}
    # dorny/paths-filter fetches the PR's changed-file list via the GitHub REST API on
    # `pull_request` events by default, which needs `pull-requests: read` -- the workflow-level
    # `permissions: contents: read` block above sets every OTHER unlisted scope to `none` for the
    # whole run, so without this the API call 403s and this job fails on every real PR (the exact
    # trigger it exists for), while `den-linux`/`den-windows`'s own `if:` (a custom condition,
    # which replaces the implicit `needs: success()` gate entirely) still falls through to
    # `needs.changes.outputs.den` == '' and silently skips instead of blocking on the failure.
    permissions:
      contents: read
      pull-requests: read
    steps:
      # persist-credentials: false on every checkout in this workflow (CodeRabbit, #126):
      # actions/checkout persists the read-only contents token into the local git config by
      # default, which a build script (any of them, not just this repo's own) could read. None of
      # these jobs push, so there's no reason to keep it around.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4
        id: filter
        with:
          filters: |
            den:
              - 'spikes/den/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - '.github/workflows/ci.yml'
            pelt:
              # spikes/pelt (not just the three pelt-* candidate crates) is included: it's a
              # shared fixture/math crate all three depend on via a path dependency (see
              # CLAUDE.md's package-map note) -- unlike den, which is fully self-contained under
              # spikes/den/**, a change scoped only to spikes/pelt/** would otherwise never
              # trigger pelt-linux/pelt-windows and could merge a real breakage undetected until
              # the weekly schedule.
              - 'spikes/pelt/**'
              - 'spikes/pelt-egui/**'
              - 'spikes/pelt-iced/**'
              - 'spikes/pelt-slint/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - '.github/workflows/ci.yml'

  fmt:
    name: cargo fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    name: cargo clippy (linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      # #29: rav1e/rav1d (spikes/sniff's AVIF tier-payload-format candidate) build their
      # optimized SIMD paths via nasm -- ubuntu-latest doesn't ship it by default.
      - run: sudo apt-get update && sudo apt-get install -y nasm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          # #117: only main's push (and scheduled/dispatch) runs save a cache; PRs restore
          # main's most recent entry (rust-cache's own prefix-matching fallback handles the
          # Cargo.lock-changed case) and skip the save step entirely. This was previously the
          # single worst line item in a PR's own CI time (a 20-30min cache upload on the
          # Windows job) and was also what caused PR runs to evict main's own cache under the
          # 10GB per-repo limit.
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # --workspace: `nicti`'s root manifest is both a workspace root and a real package
      # (not a virtual manifest), so a bare `cargo clippy` without `-p`/`--workspace` only
      # checks the root `nicti` crate and silently skips spikes/* and bench/whisker
      # entirely (verified locally: `cargo clippy --all-targets --all-features` alone
      # reports "Checking nicti" only, nothing else). Same fix cargo-deny's job already
      # needed for the same reason (see its own comment below).
      #
      # --exclude den (#117): den's own clippy check moved to the path-gated `den (linux)`/
      # `den (windows)` jobs below, so this job (which runs on every PR regardless of what it
      # touches) no longer pays for compiling eight bundled native catalog-engine libraries.
      #
      # --exclude pelt-egui/-iced/-slint (#127): these #68/ADR-0006 GUI-framework spikes alone
      # account for 311 of the 543 unique crates in a full Windows build (measured via
      # `cargo tree`) -- egui/iced/Slint each pull in their own windowing/renderer stack
      # (winit, wgpu-adjacent crates, Skia/FemtoVG for Slint). ADR-0006 is still Proposed,
      # pending #90's reference-machine run, so this isn't shipping code yet. Moved to the
      # path-gated `pelt (linux)`/`pelt (windows)` jobs below, same pattern as den. This also
      # drops the apt-get GUI-headers step from this job -- it only existed for these three
      # crates' Linux windowing backends (X11/Wayland/GL), confirmed unneeded for the rest of
      # the workspace by the pelt-linux job passing without it once it's the only Linux job
      # left compiling them; if that job's build ever fails to link, that's the first place to
      # look.
      - run: cargo clippy --workspace --exclude den --exclude pelt-egui --exclude pelt-iced --exclude pelt-slint --all-targets --all-features -- -D warnings

  clippy-windows:
    name: cargo clippy (windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      # #29: see the Linux clippy job's own nasm comment above -- same requirement, Windows's
      # own package manager.
      - run: choco install nasm -y
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }} # #117, see clippy job's comment above
      # #17: Windows is v1's actual target platform (see README's Scope section and
      # docs/adr/0001), so it -- not Linux -- is the platform whose clippy/test results should
      # gate merges. --workspace --exclude den --exclude pelt-* mirrors the Linux job exactly
      # (see its own comment above for why each flag is required).
      - run: cargo clippy --workspace --exclude den --exclude pelt-egui --exclude pelt-iced --exclude pelt-slint --all-targets --all-features -- -D warnings

  test:
    name: cargo test (linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      # #29: see the clippy job's own nasm comment above -- same requirement here.
      - run: sudo apt-get update && sudo apt-get install -y nasm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }} # #117, see clippy job's comment above
      # --workspace: see the clippy job's comment above -- without it, pawprint's and
      # sheath's tests silently never ran in CI.
      #
      # --exclude den (#117): den's own tests (including the sqlite/libsql feature-scoped
      # commands this comment used to document here) moved to the path-gated `den (linux)` job
      # below -- this job now only builds/runs the real workspace crates plus the always-on
      # spikes, on every PR regardless of what it touches.
      #
      # --exclude pelt-egui/-iced/-slint (#127): see the clippy job's comment above -- moved to
      # the path-gated `pelt (linux)` job below, same reasoning as den.
      - run: cargo test --workspace --all-targets --all-features --exclude den --exclude pelt-egui --exclude pelt-iced --exclude pelt-slint

  test-windows:
    name: cargo test (windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      # #29: see the Linux clippy job's own nasm comment above -- same requirement here.
      - run: choco install nasm -y
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }} # #117, see clippy job's comment above
      # #17: runs the full workspace test suite on Windows, the actual v1 target -- this also
      # covers nicti-claw's/dewclaw's dylib-loading tests (previously the only Windows test
      # coverage, via build-windows's own narrow `-p nicti-claw -p dewclaw` step, now redundant
      # and removed there).
      #
      # --exclude pelt-egui/-iced/-slint (#127): see the clippy job's comment above -- moved to
      # the path-gated `pelt (windows)` job below, same reasoning as den. This is the single
      # biggest driver of this job's own compile time: cold, these three crates alone pull in
      # 311 of the 543 unique crates otherwise compiled here.
      - run: cargo test --workspace --all-targets --all-features --exclude den --exclude pelt-egui --exclude pelt-iced --exclude pelt-slint

  den-linux:
    name: den (linux)
    needs: changes
    # needs.changes.result == 'failure' runs den rather than skipping it: a custom `if:` on a job
    # with `needs:` replaces the implicit `needs: success()` gate entirely, so without this a
    # `changes`-job failure (a transient API error, a future permissions regression, anything)
    # would make den silently skip instead of blocking -- CodeRabbit caught this as a real
    # structural gap even after the pull-requests:read fix (which only fixed one specific cause
    # of `changes` failing, not the underlying "failure defaults to skip" shape). Running den on
    # a `changes` failure is the safe default: worst case is an unnecessary den run, not a
    # silently-unverified one.
    if: needs.changes.result == 'failure' || needs.changes.outputs.den == 'true' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          # #127: unlike every other cache in this workflow, this one never saves, even from
          # main. den (linux) isn't a required check, only runs when path-gated in, and den
          # itself is slated for deletion once #22 lands (#123) -- its Linux cache entry
          # (1.46GiB, measured via `gh cache list`) was 14% of this repo's total cache usage
          # against GitHub's 10GB/repo limit for a job nothing else depends on being warm.
          # den (windows) is required, so its own cache still saves normally.
          save-if: false
      # den (#67/ADR-0008 and follow-ups, see CLAUDE.md's package map) is a throwaway research
      # spike, not part of the shipping v1 target -- see the #117 issue this job was split out
      # to address: every catalog-engine candidate it bundles (SQLite, DuckDB, LMDB, Turso, redb,
      # libSQL, RocksDB, fjall) was compiling from source on every single PR, most of which never
      # touch den at all. This job only runs when `spikes/den/**`/`Cargo.{toml,lock}`/this
      # workflow file change (the `changes` job's `den` filter), on a push to main, or on the
      # weekly schedule/manual dispatch above -- when path-gated out, GitHub Actions reports it
      # as skipped, which still satisfies a required-status-check gate.
      - run: cargo clippy -p den --all-targets --all-features -- -D warnings
      # --exclude den, added for #113's `libsql` engine: a blanket `--all-features` here would
      # activate `den`'s `sqlite` and `libsql` features together in the SAME feature resolution,
      # and (unlike `cargo clippy --all-features`, which only type-checks and never reached the
      # final link step -- confirmed by running it, not assumed) `cargo test` actually links
      # `den`'s bin/test binaries, which fails: `rusqlite`'s bundled `libsqlite3-sys` and
      # `libsql`'s bundled `libsql-ffi` both statically compile a full copy of real SQLite's C
      # symbols, and linking both into one binary is a genuine `multiple definition of
      # sqlite3_prepare_v3` (etc.) error, not a flaky one -- reproduced directly against this exact
      # command before adding the exclusion. `den` gets its own two feature-scoped commands below
      # instead, the same pattern the Windows job's own `-p den` line already uses.
      - run: cargo test -p den --features sqlite,duckdb,lmdb,turso,redb,rocksdb,fjall
      - run: cargo test -p den --no-default-features --features libsql,duckdb,lmdb,turso

  den-windows:
    name: den (windows)
    needs: changes
    if: needs.changes.result == 'failure' || needs.changes.outputs.den == 'true' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main' # see den-linux's comment above
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }} # #117, see clippy job's comment above
      # #115/ADR-0015's RocksDB candidate: `librocksdb-sys` generates its FFI bindings with
      # `bindgen`, which needs libclang on the build machine. GitHub's `windows-latest` runner
      # ships an msys64 install whose own `libclang.dll` conflicts with the one bindgen needs
      # (confirmed against `rust-rocksdb/rust-rocksdb`'s own upstream CI, which carries this exact
      # workaround for this exact reason -- not a guess). Removing it and installing LLVM via
      # choco mirrors that upstream recipe precisely rather than inventing a different fix.
      - name: Remove msys64 (bindgen/libclang conflict, RocksDB build)
        run: Remove-Item -LiteralPath "C:\msys64\" -Force -Recurse -ErrorAction SilentlyContinue
      - name: Install LLVM (bindgen/libclang, RocksDB build)
        run: choco install llvm -y
      # #67/ADR-0008's Windows hard gate (plus #102/ADR-0009's Turso, #106/ADR-0010's redb,
      # #115/ADR-0015's RocksDB, and #116/ADR-0016's fjall follow-ups): each catalog-database-engine
      # candidate must build and pass its cross-engine correctness test on the actual v1 target, not
      # just Linux -- this is exactly the gate that eliminated pglite-rs (its build.rs passes a
      # Unix-only linker flag, confirmed unrunnable here) before a Windows CI job ever had to prove
      # it. `-p den` only (not `--workspace`): den is a spike, same reasoning as the `-p nicti`
      # build in the main Windows job. `redb` was missing from this list even after ADR-0010
      # merged (a real gap, fixed while resolving an earlier merge, not by either side's own diff)
      # -- it, `rocksdb`, and `fjall` all combine fine with `sqlite` (none bundles a competing
      # SQLite C fork), so all three join the main command below; mirrors the Linux job's
      # already-validated command.
      - run: cargo test -p den --features sqlite,duckdb,lmdb,turso,redb,rocksdb,fjall
      # #113's libSQL candidate needs its own, separate step: `rusqlite`'s bundled
      # `libsqlite3-sys` and `libsql`'s bundled `libsql-ffi` both statically link a full copy of
      # real SQLite's C symbols into the same `den` binary, which fails at the final link step
      # with `multiple definition of sqlite3_prepare_v3` (etc.) if both features are enabled
      # together -- confirmed locally, not assumed. `duckdb`/`lmdb`/`turso` don't bundle a real
      # sqlite3.c (DuckDB is its own engine; LMDB and Turso Database don't touch SQLite's C code
      # at all), so they combine with `libsql` here without the same clash.
      - run: cargo test -p den --no-default-features --features libsql,duckdb,lmdb,turso

  pelt-linux:
    name: pelt (linux)
    needs: changes
    # See den-linux's comment above for why the changes-failure case runs rather than skips.
    if: needs.changes.result == 'failure' || needs.changes.outputs.pelt == 'true' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          # #127: same reasoning as den-linux's own save-if: false above -- not a required
          # check, rarely touched, and its own cache entry would otherwise ride along on every
          # main push regardless of whether these spikes changed.
          save-if: false
      # #68/ADR-0006's pelt-egui/pelt-iced/pelt-slint spikes pull in winit's Linux backends
      # (X11/Wayland) plus Slint's Skia/FemtoVG renderers. Precautionary, NOT independently
      # confirmed as required -- see #126's original version of this comment (moved here
      # verbatim from the main clippy/test jobs when #127 split these crates out): a local
      # sandbox build succeeded with none of these packages installed. If this job passes
      # without it in a follow-up, remove it; if it fails to link, check the error for the
      # missing .so and adjust the list to match.
      - run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev libwayland-dev libx11-dev libxi-dev libxrandr-dev libgl1-mesa-dev libfontconfig1-dev
      - run: cargo clippy -p pelt-egui -p pelt-iced -p pelt-slint --all-targets --all-features -- -D warnings
      - run: cargo test -p pelt-egui -p pelt-iced -p pelt-slint --all-targets --all-features

  pelt-windows:
    name: pelt (windows)
    needs: changes
    if: needs.changes.result == 'failure' || needs.changes.outputs.pelt == 'true' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main' # see den-linux's comment above
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }} # required check, see clippy job's comment above
      # #17/#127: this is a required (blocking) check, matching how den (windows) is required
      # for the same reason -- Windows is v1's actual target, so a GUI-framework candidate must
      # prove out on it, not just Linux.
      - run: cargo clippy -p pelt-egui -p pelt-iced -p pelt-slint --all-targets --all-features -- -D warnings
      - run: cargo test -p pelt-egui -p pelt-iced -p pelt-slint --all-targets --all-features

  cargo-deny:
    name: cargo deny (licenses)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2
        with:
          command: check licenses
          # cargo-deny only resolves the root package's deps by default; --workspace pulls in
          # spikes/* and bench/whisker too (verified locally: without it, only `nicti` itself
          # shows up in `cargo deny list`). --all-features is the action's own default -- keep it
          # explicit since setting `arguments` overrides rather than appends to that default.
          # Deliberately NOT path-gated like the den test/clippy jobs above: this only resolves
          # the dependency graph (no compilation), so it stays cheap (~1min) regardless of which
          # den features are in the graph, and license drift is worth catching on every PR.
          arguments: --workspace --all-features

  build-windows:
    name: cargo build (windows, v1 target)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }} # #117, see clippy job's comment above
      # -p nicti, not a bare workspace build: spikes/* are throwaway
      # research crates (see CLAUDE.md's package map section), not part of
      # the shipping v1 target, and shouldn't ride along in the release
      # build that validates it.
      - run: cargo build --release -p nicti
      # #17: nicti-claw's/dewclaw's dylib-loading tests (DLL_PREFIX/DLL_SUFFIX, LoadLibrary
      # semantics) now run as part of test-windows's full `--workspace` run above, so this job's
      # own narrow `-p nicti-claw -p dewclaw` step was removed as redundant.
      #
      # #117: den's own Windows coverage (including the RocksDB/bindgen msys64 workaround and
      # both `-p den` feature-scoped test commands this comment used to document here) moved to
      # the path-gated `den (windows)` job above -- this job now only builds/tests the real v1
      # target's own crates on every PR, regardless of what it touches.

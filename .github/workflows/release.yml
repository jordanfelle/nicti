name: Release

# #249/ADR-0249: builds the Windows installer, minisign-signs it (the update trust anchor
# nicti-shed verifies -- see crates/nicti-shed), optionally Authenticode-signs it via SignPath
# once that application is approved, and publishes to a GitHub Release. `workflow_dispatch`
# without a tag runs the same build+sign steps and uploads a workflow artifact instead of
# publishing, for a dry run.
#
# #267: two channels out of this one workflow, not two branches. A `vX.Y.Z` tag push still cuts
# the real, permanent, Cargo.toml-version-matched stable release exactly as before. A push to
# `main` (i.e. every merge) additionally builds and republishes a single moving `edge`
# prerelease at that commit -- watch that release page (or the repo, with "Releases only"
# notifications) for a build off the tip of main. GitHub's `/releases/latest` API (what
# nicti-shed's auto-updater polls) never returns a prerelease, so `edge` can't be picked up by
# the stable auto-update channel -- no updater code change needed for this.

on:
  push:
    tags:
      - 'v*'
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  # Never cancel-in-progress (CodeRabbit review, PR #268): the point of this shared group is to
  # serialize main-push edge publishers, not race them. Two overlapping runs could otherwise both
  # pass the "is main still at my SHA" guard before either had moved the `edge` tag, then
  # interleave their tag-move/upload calls -- with cancel-in-progress off, a later push's run
  # queues behind the current one instead of running concurrently with it, so by the time it
  # starts, any earlier run has already fully finished (published or cleanly skipped as stale).
  # Tag-push (stable release) runs already never shared a group with anything else (each tag is
  # its own `github.ref`), so this doesn't change their behavior at all.
  #
  # KNOWN LIMIT (a second CodeRabbit pass, same PR): a GitHub Actions concurrency group only
  # ever holds one running run plus one *pending* run -- it is not an unbounded FIFO queue. If a
  # third push to main lands while one run (from the first push) is already executing and a
  # second push's run is already the queued pending run, that third push's run replaces the
  # *second* push's pending run (the second push's own dedicated edge build is simply discarded,
  # never run -- the third push's run is what actually runs next, not delayed and not itself
  # discarded). In practice this only drops that intermediate push's own edge publish, not
  # correctness of the channel itself: whichever run does end up executing always builds from
  # its own actual `HEAD`, so `edge` still converges on the true tip of main once the burst
  # settles -- it just isn't guaranteed to have published a distinct build for every single
  # individual merge if several land within one build's runtime. A real fix (an external
  # queue/self-hosted runner that retains every push) is a meaningfully bigger change than this
  # ticket's scope and isn't justified for how infrequently main sees multiple merges within a
  # single ~10-15 minute Windows build window on this repo today.
  cancel-in-progress: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  # Cheap, Linux-only gate in front of the expensive Windows build. Before #267, the placeholder
  # key check below only ever ran on a deliberate tag push or workflow_dispatch -- someone
  # actively cutting a release, who'd see and act on the failure. Once #267 made every push to
  # main trigger this workflow too, that same hard failure started firing on every single merge
  # (the production minisign keypair hasn't been generated yet, see docs/releasing.md), turning
  # main permanently red for a condition that isn't actually a bug in any of those merges. A tag
  # push shipping with the placeholder key still *is* a real bug (silently breaks every future
  # client's update-signature check) and must keep failing hard; an automatic edge build hitting
  # the same not-yet-configured state is expected/inert until the one-time key setup happens, and
  # should just skip cleanly instead.
  check-release-key:
    name: check production minisign key
    runs-on: ubuntu-latest
    outputs:
      ready: ${{ steps.check.outputs.ready }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          sparse-checkout: crates/nicti-shed/src/lib.rs
          sparse-checkout-cone-mode: false

      - name: Check for the placeholder minisign key
        id: check
        shell: bash
        run: |
          if grep -q 'RWQQhGAWQ6j6RtbA5MtQbNkvNW+yqSuYR0GAJ+YBR1DbMY87J0uIxEmK' crates/nicti-shed/src/lib.rs; then
            # A tag push and an explicit workflow_dispatch are both someone deliberately
            # exercising the build/sign pipeline (the latter is docs/releasing.md's own
            # pre-tag dry-run step) -- they should see and act on a loud failure, not have it
            # silently downgrade to a no-op skip the way an automatic main-push edge build does.
            if [[ "${GITHUB_REF_TYPE}" == "tag" || "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
              echo "::error::crates/nicti-shed/src/lib.rs still has the placeholder PUBLIC_KEY_BASE64 -- generate the real production keypair per docs/releasing.md before releasing."
              exit 1
            fi
            echo "::notice::Skipping this edge build: crates/nicti-shed/src/lib.rs still has the placeholder minisign PUBLIC_KEY_BASE64. Generate the real production keypair per docs/releasing.md to enable edge builds."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

  build:
    name: build installer (windows)
    needs: check-release-key
    if: needs.check-release-key.outputs.ready == 'true'
    runs-on: windows-latest
    permissions:
      contents: write # only this job needs to publish a release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Resolve version
        id: version
        shell: bash
        run: |
          cargo_version=$(cargo metadata --no-deps --format-version=1 | jq -r '.packages[] | select(.name=="nicti") | .version')
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            tag_version="${GITHUB_REF_NAME#v}"
            if [[ "$tag_version" != "$cargo_version" ]]; then
              echo "::error::tag v$tag_version does not match nicti's Cargo.toml version $cargo_version"
              exit 1
            fi
          fi
          echo "version=$cargo_version" >> "$GITHUB_OUTPUT"

      - uses: dtolnay/rust-toolchain@stable
      # zizmor flags restoring a cache here as a poisoning vector (a malicious cache entry from
      # an untrusted run being restored into a run with write/secrets access). Not adding
      # `lookup-only: true` deliberately: this workflow only ever runs from a pushed tag or an
      # explicit `workflow_dispatch`, both of which already require write access to this repo --
      # an attacker who could poison the cache in the first place would already need the same
      # access this workflow itself requires, so the restore isn't a real escalation path here,
      # unlike a `pull_request`-triggered workflow accepting a cache seeded by an untrusted fork.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          save-if: false # release builds are infrequent; not worth a dedicated cache entry

      # A release build must never ship nicti-shed's placeholder minisign key -- it's a real
      # keypair generated solely to exercise that crate's own tests (see its own doc comment),
      # and a release signed while this placeholder is still embedded would mean the client-side
      # verification key in a real user's install doesn't actually match the CI signing key,
      # silently breaking update verification. Fails loudly, in CI, before any build work happens
      # -- not a runtime guard in the shipped binary, which would only ever be caught by a human
      # looking at logs after the fact.
      - name: Verify the production minisign key is set
        shell: bash
        run: |
          if grep -q 'RWQQhGAWQ6j6RtbA5MtQbNkvNW+yqSuYR0GAJ+YBR1DbMY87J0uIxEmK' crates/nicti-shed/src/lib.rs; then
            echo "::error::crates/nicti-shed/src/lib.rs still has the placeholder PUBLIC_KEY_BASE64 -- generate the real production keypair per docs/releasing.md before releasing."
            exit 1
          fi

      - name: Build nicti.exe
        run: cargo build --release -p nicti

      # SmartScreen/Authenticode signing, once the SignPath Foundation application (a follow-up
      # to #249, see the ADR) is approved. Skipped entirely until then -- v1's first releases
      # ship unsigned, relying on the minisign signature below (not Authenticode) as the actual
      # update-integrity check. Also gated on `github.ref_type == 'tag'` (#267): the edge channel
      # is meant to stay minisign-only even after SignPath is enabled -- it's an unreviewed,
      # possibly-broken build of the tip of main, and Authenticode-signing it would put Nicti's
      # verified-publisher reputation behind every merge rather than just real releases.
      - name: Upload nicti.exe for signing
        if: vars.SIGNPATH_ENABLED == 'true' && github.ref_type == 'tag'
        id: upload_nicti_exe
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: nicti-exe-unsigned
          path: target/release/nicti.exe

      - name: Sign nicti.exe (SignPath)
        if: vars.SIGNPATH_ENABLED == 'true' && github.ref_type == 'tag'
        uses: SignPath/github-action-submit-signing-request@f6d04783b4569d051e0c80105fe66e82819d0092 # v3
        with:
          api-token: '${{ secrets.SIGNPATH_API_TOKEN }}'
          organization-id: '${{ vars.SIGNPATH_ORG_ID }}'
          project-slug: 'nicti'
          signing-policy-slug: 'release-signing'
          artifact-configuration-slug: 'nicti-exe'
          github-artifact-id: '${{ steps.upload_nicti_exe.outputs.artifact-id }}'
          wait-for-completion: true
          output-artifact-directory: 'target/release'

      - name: Install NSIS
        shell: pwsh
        run: |
          if (-not (Get-Command makensis -ErrorAction SilentlyContinue)) {
            choco install nsis -y
            # A GitHub Actions job's process PATH isn't refreshed mid-job after an installer
            # runs -- only steps that come after this one pick up an addition to GITHUB_PATH.
            Add-Content -Path $env:GITHUB_PATH -Value 'C:\Program Files (x86)\NSIS'
          }

      - name: Build installer
        shell: pwsh
        env:
          NICTI_VERSION: ${{ steps.version.outputs.version }}
        run: |
          & makensis "/DVERSION=$env:NICTI_VERSION" "/DSRCDIR=${{ github.workspace }}\target\release" packaging\windows\nicti.nsi

      # SignPath also has to sign the installer itself, not just nicti.exe -- both binaries ship
      # to the user. Same gate as above (edge builds excluded, #267).
      - name: Upload installer for signing
        if: vars.SIGNPATH_ENABLED == 'true' && github.ref_type == 'tag'
        id: upload_installer
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: nicti-installer-unsigned
          path: packaging/windows/Nicti-Setup-*.exe

      - name: Sign installer (SignPath)
        if: vars.SIGNPATH_ENABLED == 'true' && github.ref_type == 'tag'
        uses: SignPath/github-action-submit-signing-request@f6d04783b4569d051e0c80105fe66e82819d0092 # v3
        with:
          api-token: '${{ secrets.SIGNPATH_API_TOKEN }}'
          organization-id: '${{ vars.SIGNPATH_ORG_ID }}'
          project-slug: 'nicti'
          signing-policy-slug: 'release-signing'
          artifact-configuration-slug: 'nicti-installer'
          github-artifact-id: '${{ steps.upload_installer.outputs.artifact-id }}'
          wait-for-completion: true
          output-artifact-directory: 'packaging/windows'

      - name: minisign the installer
        shell: bash
        env:
          # An *unencrypted* minisign secret key -- rsign2's `sign` subcommand has no
          # non-interactive way to supply a password (it reads straight from /dev/tty via
          # `rpassword`, ignoring redirected stdin entirely; confirmed this hangs/fails with
          # ENXIO in a real CI run, no controlling tty). A CI signing key can't be interactively
          # unlocked anyway, so a password adds no real protection here -- the actual secret
          # boundary is the GitHub Actions secret store itself. Base64-decoded to a temp file
          # below and deleted immediately after use -- never written to the workspace or logged.
          MINISIGN_KEY_B64: ${{ secrets.NICTI_UPDATE_MINISIGN_KEY_B64 }}
        run: |
          cargo install rsign2 --locked
          key_file="$RUNNER_TEMP/minisign.key"
          echo "$MINISIGN_KEY_B64" | base64 -d > "$key_file"
          installer=$(ls packaging/windows/Nicti-Setup-*.exe)
          rsign sign -s "$key_file" -x "$installer.minisig" -W "$installer"
          rm -f "$key_file"
          sha256sum "$installer" > "$installer.sha256"

      # The build-time placeholder-key check above only catches an *unrotated* placeholder --
      # it says nothing about whether the real secret (NICTI_UPDATE_MINISIGN_KEY_B64) actually
      # corresponds to the real public key compiled into this build's nicti-shed. A mismatch
      # there (the secret rotated without updating PUBLIC_KEY_BASE64, or vice versa) would
      # otherwise ship a release that every real client silently fails to verify, and nothing
      # earlier in this workflow would have caught it. Block the actual publish on this, not
      # just the placeholder check.
      - name: Verify installer signature matches the compiled public key
        shell: bash
        run: |
          public_key=$(grep -oP '(?<=PUBLIC_KEY_BASE64: &str = ")[^"]+' crates/nicti-shed/src/lib.rs)
          installer=$(ls packaging/windows/Nicti-Setup-*.exe)
          rsign verify "$installer" -P "$public_key" -x "$installer.minisig" -q

      - name: Upload dry-run artifact
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: nicti-installer-${{ steps.version.outputs.version }}
          path: |
            packaging/windows/Nicti-Setup-*.exe
            packaging/windows/Nicti-Setup-*.exe.minisig
            packaging/windows/Nicti-Setup-*.exe.sha256

      - name: Publish release
        if: github.event_name == 'push' && github.ref_type == 'tag'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          NICTI_VERSION: ${{ steps.version.outputs.version }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --repo "${GITHUB_REPOSITORY}" \
            --title "Nicti ${NICTI_VERSION}" \
            --generate-notes \
            packaging/windows/Nicti-Setup-*.exe \
            packaging/windows/Nicti-Setup-*.exe.minisig \
            packaging/windows/Nicti-Setup-*.exe.sha256

      # #267: the bleeding-edge channel. `edge` is a single moving tag/release, force-moved and
      # reused (never deleted) on every main push, rather than accumulating one release per
      # merge. `--prerelease` is what keeps this out of `/releases/latest` (see the top-of-file
      # comment), so nicti-shed's stable auto-updater never sees it.
      #
      # CodeRabbit review (PR #268) caught three real issues in an earlier delete-then-recreate
      # approach and this rewrite addresses all three at the root instead of patching around them:
      #   1. Deleting the old `edge` release before the new one's assets finish uploading left a
      #      window where `edge` didn't exist at all if upload failed or was canceled mid-step.
      #   2. GitHub doesn't guarantee run ordering -- a re-run of an older, superseded workflow
      #      run (stale GITHUB_SHA) could still overwrite a newer edge build with an older one.
      #   3. A partially-failed tag delete could leave `gh release create --target` silently
      #      targeting the wrong (stale) commit, and the script had no `set -e` to stop on it.
      # Fix: never delete the `edge` release at all -- force-move (or create, on the very first
      # run) the `edge` tag as a single atomic ref update, then edit-in-place/clobber-upload onto
      # the same release object. `set -euo pipefail` means any failed step here (including the
      # stale-run guard below) stops the job instead of silently falling through.
      #
      # A second adversarial pass on this rewrite (still PR #268) found three more real issues,
      # addressed below:
      #   4. "Never delete" means a version bump (Cargo.toml's version, which the installer
      #      filename embeds) leaves the *previous* version's exe/.minisig/.sha256 permanently
      #      attached alongside the new ones forever -- `--clobber` only overwrites an asset
      #      whose filename matches exactly, it never removes a differently-named one. Fixed by
      #      deleting every existing asset that isn't one of this run's exact filenames before
      #      uploading.
      #   5. The two GET calls against the tag ref used the plural `git/refs/{ref}` route, which
      #      is documented for update/delete, not fetch -- `git/ref/{ref}` (singular) is the
      #      correct fetch endpoint and doesn't prefix-match (the plural GET form returns an
      #      array if more than one ref shares the prefix, e.g. a future `edge-preview` tag).
      #   6. `cancel-in-progress` cancellation is best-effort, not synchronous -- two runs could
      #      both pass a plain stale-run guard and then race on the actual tag-move/upload calls
      #      if they were close enough together. A second CodeRabbit pass on this same PR pointed
      #      out that a second guard call only narrows that TOCTOU window, it doesn't close it --
      #      the real fix is to stop the runs from overlapping at all. `cancel-in-progress: false`
      #      above does that: main-push runs now queue in this one shared concurrency group
      #      instead of running concurrently, so by the time any run reaches this step, every
      #      earlier-queued run has already fully finished. The second guard call below is now
      #      pure defense-in-depth for a state that should never actually occur -- so it fails
      #      loudly (exit 1) instead of quietly exiting 0, since seeing it fire would mean the
      #      serialization assumption above was somehow violated (worth investigating), not a
      #      normal, expected outcome the way a stale run at the very start of the step is.
      - name: Publish edge release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          # true (0) if main is still at this run's commit, false otherwise -- callers decide
          # what a stale result means for them (see the two call sites below).
          still_current() {
            remote_main_sha=$(gh api "repos/${GITHUB_REPOSITORY}/commits/main" --jq '.sha')
            [[ "$remote_main_sha" == "${GITHUB_SHA}" ]]
          }

          # Guard against an out-of-order re-run: if main has already advanced past this run's
          # commit before any of this run's own changes have been made, this run is simply stale
          # -- skip cleanly, there's nothing to undo yet.
          if ! still_current; then
            echo "::notice::main has advanced since this run started at ${GITHUB_SHA} -- skipping the edge publish so this stale run can't move edge backward."
            exit 0
          fi

          if gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/edge" >/dev/null 2>&1; then
            gh api -X PATCH "repos/${GITHUB_REPOSITORY}/git/refs/tags/edge" -f sha="${GITHUB_SHA}" -F force=true >/dev/null
          else
            gh api -X POST "repos/${GITHUB_REPOSITORY}/git/refs" -f ref="refs/tags/edge" -f sha="${GITHUB_SHA}" >/dev/null
          fi

          actual_sha=$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/edge" --jq '.object.sha')
          if [[ "$actual_sha" != "${GITHUB_SHA}" ]]; then
            echo "::error::edge tag points at $actual_sha after the move, not this commit (${GITHUB_SHA})."
            exit 1
          fi

          if ! still_current; then
            echo "::error::main advanced after this run already moved the edge tag to ${GITHUB_SHA} -- with main-push runs serialized (cancel-in-progress: false), this should never happen. Failing loudly rather than silently leaving a partially-applied publish."
            exit 1
          fi

          notes="Automatic build from the latest commit on main (${GITHUB_SHA}). Unsigned and may be unstable -- for the stable channel, see the latest versioned release instead."
          release_exists=0
          gh release view edge --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1 && release_exists=1

          if [[ "$release_exists" == "1" ]]; then
            # `--target` here isn't just cosmetic: `nicti-shed`'s Edge-channel update check (#282)
            # reads this release's `target_commitish` as the edge build's identity. Without
            # `--target`, `gh release edit` only ever updates title/notes/prerelease -- the
            # underlying tag ref moves every push (the `git/refs/tags/edge` PATCH above), but
            # `target_commitish` stays frozen at whatever the release's original `gh release
            # create --target` set, forever, even though the assets underneath it keep changing.
            # Confirmed by direct testing against the live release (#284): editing without
            # `--target` left it stale; adding it updated it immediately.
            gh release edit edge --repo "${GITHUB_REPOSITORY}" \
              --title "Nicti edge (${GITHUB_SHA:0:7})" \
              --notes "$notes" \
              --prerelease \
              --target "${GITHUB_SHA}"

            # Upload under temporary names first, then swap (CodeRabbit review, PR #268):
            # `gh release upload --clobber` deletes an existing same-named asset before
            # uploading its replacement -- not atomic, so a failed upload after that delete
            # leaves `edge` missing that asset entirely. This bites on every ordinary push that
            # doesn't change Cargo.toml's version (the common case, since the installer filename
            # is version-derived and stays the same across most edge builds), not just the
            # version-bump case the upload-before-cleanup reorder above already covers. Staging
            # under a unique temp suffix means none of the previously-published assets are
            # touched until every new file has fully uploaded; the final swap is a metadata-only
            # rename (delete old, then PATCH the temp asset's name into place), not a re-upload,
            # so there's no meaningful window where the canonical name has no content behind it.
            tmp_dir=$(mktemp -d)
            tmp_suffix=".pending-${GITHUB_SHA:0:7}"
            declare -a final_names=()
            declare -a tmp_paths=()
            for f in packaging/windows/Nicti-Setup-*.exe packaging/windows/Nicti-Setup-*.exe.minisig packaging/windows/Nicti-Setup-*.exe.sha256; do
              final="$(basename "$f")"
              tmp_path="$tmp_dir/${final}${tmp_suffix}"
              cp "$f" "$tmp_path"
              final_names+=("$final")
              tmp_paths+=("$tmp_path")
            done

            gh release upload edge --repo "${GITHUB_REPOSITORY}" "${tmp_paths[@]}"

            # `gh release view --json assets` surfaces gh's own GraphQL global node id under
            # `.id` (e.g. "RA_kwDO..."), not the plain REST integer id the
            # `/releases/assets/{id}` DELETE/PATCH endpoints below require -- every rename in
            # this loop 404s on that id (#284, confirmed directly: it silently never came up in
            # any prior run, since this branch's very first real execution -- the first push
            # after a real `edge` release already existed -- was this same run). Read ids from
            # `GET /repos/.../releases/tags/edge` instead, whose `assets[].id` is the real REST
            # integer.
            for i in "${!final_names[@]}"; do
              final="${final_names[$i]}"
              tmp_name="$(basename "${tmp_paths[$i]}")"
              existing_id=$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/edge" --jq ".assets[] | select(.name==\"$final\") | .id")
              if [[ -n "$existing_id" ]]; then
                gh api -X DELETE "repos/${GITHUB_REPOSITORY}/releases/assets/${existing_id}" >/dev/null
              fi
              tmp_id=$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/edge" --jq ".assets[] | select(.name==\"$tmp_name\") | .id")
              gh api -X PATCH "repos/${GITHUB_REPOSITORY}/releases/assets/${tmp_id}" -f name="$final" >/dev/null
            done

            rm -rf "$tmp_dir"

            # Finding 4: remove any asset left over from a prior version bump (a differently
            # named exe/.minisig/.sha256 the swap above didn't touch, since it only knew this
            # run's own filenames) -- `edge` should only ever carry exactly one version's
            # installer.
            current_names="packaging/windows/Nicti-Setup-*.exe packaging/windows/Nicti-Setup-*.exe.minisig packaging/windows/Nicti-Setup-*.exe.sha256"
            for existing in $(gh release view edge --repo "${GITHUB_REPOSITORY}" --json assets --jq '.assets[].name'); do
              keep=0
              for f in $current_names; do
                [[ "$existing" == "$(basename "$f")" ]] && keep=1
              done
              if [[ "$keep" == "0" ]]; then
                gh release delete-asset edge "$existing" --repo "${GITHUB_REPOSITORY}" --yes
              fi
            done
          else
            gh release create edge \
              --repo "${GITHUB_REPOSITORY}" \
              --title "Nicti edge (${GITHUB_SHA:0:7})" \
              --target "${GITHUB_SHA}" \
              --prerelease \
              --notes "$notes" \
              packaging/windows/Nicti-Setup-*.exe \
              packaging/windows/Nicti-Setup-*.exe.minisig \
              packaging/windows/Nicti-Setup-*.exe.sha256
          fi

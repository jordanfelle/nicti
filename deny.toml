# Enforces the Rust-crate license allowlist from docs/adr/0003-third-party-license-policy.md.
# Scope: licenses only (advisories/bans/sources are out of scope here; Renovate covers vuln bumps).

[graph]
all-features = true

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "CC0-1.0",
    "MIT-0",
    "Unlicense",
    "Unicode-3.0",
    # LGPL is allowed here only as one arm of an OR-license crate (e.g. r-efi); a Rust crate whose
    # *only* option is LGPL/GPL-family is not on this list and must fail the check. See
    # docs/adr/0003-third-party-license-policy.md's "LGPL crates ... need a case-by-case sign-off"
    # rule -- rawler/lensfun-rs are the known future case, not pre-cleared by adding LGPL here.
    "LGPL-2.1-or-later",
]
confidence-threshold = 0.9

# publish = false workspace crates carry no SPDX license (nicti, pawprint, whisker) -- this exempts
# them from the license check entirely rather than failing on our own unlicensed-by-design internal
# crates (verified: `cargo deny check licenses` passes with them Unlicensed and this set to true;
# flipping it to false reintroduces them as failures).
[licenses.private]
ignore = true

[bans]
multiple-versions = "allow"

[advisories]
ignore = ["*"]

[sources]
unknown-registry = "allow"
unknown-git = "allow"

# Enforces the Rust-crate license allowlist from docs/adr/0003-third-party-license-policy.md.
# Scope: licenses only (advisories/bans/sources are out of scope here; Renovate covers vuln bumps).

[graph]
all-features = true

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "CC0-1.0",
    "MIT-0",
    "Unlicense",
    "Unicode-3.0",
    # ISC: added for `libloading` (ADR-0004/#19) -- functionally MIT-equivalent, a short
    # permissive license with no copyleft terms; OSI-approved and FSF Free/Libre.
    "ISC",
    # Zlib: added for `foldhash` (wasmtime/cranelift's `hashbrown`, ADR-0004/#19) and `slotmap`
    # (`glow`, wgpu-hal's GLES backend, ADR-0005/#16) -- both carry Zlib as their *sole* license
    # (no MIT/Apache-2.0 OR-arm), so unlike bytemuck/glow/raw-window-handle (which also list Zlib
    # but pass today via their own MIT/Apache-2.0 arm) these two needed it added outright. Same
    # permissive-with-no-copyleft-terms category as ISC above: OSI-approved, FSF Free/Libre.
    "Zlib",
    # NCSA: `libfuzzer-sys`'s fuzz-target dependency, pulled in transitively via
    # `image` -> `ravif` -> `rav1e` -> `libfuzzer-sys` by the AVIF encoder feature the egui/iced/
    # Slint GUI-framework candidates all enable on `image` for their asset-loading paths (#68/
    # ADR-0006's `pelt-*` spikes) -- not a choice made by this repo, and not linked into any
    # actual pelt-* binary's fuzzing path, just present in the resolved dependency graph.
    # Permissive, OSI-approved, no copyleft terms -- same category as ISC/Zlib above, added
    # globally rather than scoped to `libfuzzer-sys` since any future crate pulling in AVIF
    # support via `ravif` would hit the identical transitive dependency.
    "NCSA",
    # BSL-1.0: `clipboard-win`/`error-code`, pulled in transitively by every #68/ADR-0006 `pelt-*`
    # candidate's own clipboard integration (arboard via egui/Slint, window_clipboard via iced).
    # Permissive, OSI-approved, no copyleft terms -- same category as ISC/Zlib/NCSA above.
    "BSL-1.0",
    # 0BSD: `varint-rs`, a transitive dependency of `lsm-tree` (the LSM-tree engine `fjall` wraps,
    # #116/ADR-0014's evaluation). The BSD Zero Clause License is OSI-approved and even more
    # permissive than MIT/Apache-2.0 -- no attribution requirement at all -- same
    # no-copyleft-terms category as ISC/Zlib/NCSA/BSL-1.0 above.
    "0BSD",
    # OFL-1.1 / Ubuntu-font-1.0: `epaint_default_fonts` bundles actual font *data* (not just code)
    # under egui's `default_fonts` feature (#68/ADR-0006's pelt-egui spike). Both are OSI-approved,
    # permissive-for-redistribution open font licenses (SIL OFL is the standard license for
    # bundling fonts, explicitly designed to permit this) -- but unlike the pure-code licenses
    # above, this is exactly the kind of bundled-data case ADR-0003's Process section means by "a
    # new dependency... gets a row in docs/licensing.md in the same PR" -- see that file's
    # #68/ADR-0006 rows.
    "OFL-1.1",
    "Ubuntu-font-1.0",
    # CDLA-Permissive-2.0: `webpki-roots` (Mozilla's root CA bundle, republished as Rust source
    # data), a build-time-only dependency of `libduckdb-sys`'s build script (`duckdb` -> `ureq` ->
    # `webpki-roots`, #67/ADR-0007's `spikes/den`) -- not linked into any shipped binary. Same
    # bundled-data category as OFL-1.1/Ubuntu-font-1.0 above: a Linux-Foundation-drafted
    # permissive data license with no copyleft terms, standard for redistributing root-cert data.
    "CDLA-Permissive-2.0",
    # GPL-3.0/AGPL-3.0/GPL-2.0-or-later: added 2026-09-24 per ADR-0003's amendment (#66/ADR-0010 --
    # Nicti's own outbound license is now AGPL-3.0-or-later, so these are combinable into it, not
    # a compatibility risk the way they were when the outbound license was still undecided).
    # LGPL is *still* deliberately not listed here, though the reason changed 2026-09-25 (#37):
    # LGPL-2.1 combining into an AGPL-3.0-or-later work turned out to need no "or-later" grant at
    # all (LGPL-2.1 §§5-6 permit it directly, see docs/licensing.md's Flags §2 for the full
    # citation trail) -- the compatibility question itself is resolved for `rawler`/`lensfun-rs`
    # alike. What's still per-crate, not blanket-allowlistable, is §6's own packaging condition
    # (notice + source-availability obligation for the LGPL'd portion) -- cargo-deny can check
    # license *compatibility*, not whether a shipped build actually satisfies that obligation, so
    # each LGPL dependency still gets its own scoped exception (see below) rather than a global
    # allow entry, same principle as the OR-arm-matching caveat this section already documents.
    "GPL-3.0-only",
    "GPL-3.0-or-later",
    "AGPL-3.0-only",
    "AGPL-3.0-or-later",
    "GPL-2.0-or-later",
    # Deliberately NOT "GPL-2.0-only": without an "or later" arm, GPL-2.0-only code cannot be
    # combined into a GPL-3.0-family work (Nicti's own AGPL-3.0-or-later license) -- this is a
    # real incompatibility, not a leftover-caution omission like the ones below. A crate whose
    # *sole* license is exactly "GPL-2.0-only" should still fail this check; if one is ever needed,
    # that's a real ADR-0003 conversation (dual-licensing, a permissive fork, etc.), not an
    # allowlist edit.
    # MPL-2.0: `avif-parse` (AVIF-container demuxer, pulled in by `avif-decode`, #29's spike-only
    # AVIF-vs-JPEG tier-payload comparison). File-level weak copyleft, OSI-approved, FSF Free/Libre
    # -- combines cleanly into a GPL-3.0-family work the same way the GPL/AGPL entries above do,
    # not a permissive-only case like ISC/Zlib/NCSA above it.
    "MPL-2.0",
    # IJG: the Independent JPEG Group License, one arm of `jpeg-encoder`'s compound
    # "(MIT OR Apache-2.0) AND IJG" license (the crate's JPEG-table/quantization code traces back
    # to IJG's reference implementation). FSF Free/Libre, permissive, no copyleft terms -- same
    # category as ISC/Zlib/NCSA/BSL-1.0/0BSD above.
    "IJG",
]
# Deliberately NOT listing any LGPL variant, even for r-efi's "MIT OR Apache-2.0 OR
# LGPL-2.1-or-later" -- cargo-deny only needs ONE allowed arm of an OR expression to pass a crate
# (verified: r-efi passes today via its MIT/Apache-2.0 arms with no LGPL entry in `allow` at all),
# so adding an LGPL SPDX string here would have no upside and a real downside: cargo-deny can't
# express "only as an OR-arm" -- it would also pass a future crate whose *sole* license is that
# exact LGPL string. For `lensfun-rs` specifically, its confirmed or-later dual license needed no
# special sign-off once Nicti's own license was already copyleft (ADR-0003's amendment). `rawler`
# (and LibRaw, vendored outside Cargo's graph entirely) turned out to need no "or-later" grant
# either, once #37 checked LGPL-2.1's actual §§5-6 text (docs/licensing.md's Flags §2) -- but the
# general principle (don't widen an allowlist just because cargo-deny's OR-arm matching makes it
# convenient, since it can't verify per-crate packaging compliance) still holds regardless. This
# stays an explicit choice, not an oversight.
confidence-threshold = 0.9

# Spike-scoped exception (#68/ADR-0006): Slint's own crates carry
# "GPL-3.0-only OR LicenseRef-Slint-Royalty-free-2.0 OR LicenseRef-Slint-Software-3.0" -- none of
# which are on the allow-list above, and `LicenseRef-Slint-*` are Slint's own non-SPDX-registered
# proprietary-with-exceptions license texts, not something cargo-deny can evaluate generically.
# Scoped to exactly the Slint-published crate names (not a global allow, unlike ISC/Zlib/NCSA
# above) so this never silently passes an unrelated future GPL-only crate. This is a research
# spike only (`spikes/pelt-slint`, not a production crate, see CLAUDE.md's package-map note) --
# if Slint is the ADR-0006 winner, ship-decision consequences documented there require an
# ADR-0003 amendment and explicit sign-off before any of this ships in `nicti-render`/`nicti-ui`,
# the same standard already applied to LGPL-as-Cargo-dependency crates like `rawler`/`lensfun-rs`.
[[licenses.exceptions]]
allow = ["GPL-3.0-only", "LicenseRef-Slint-Royalty-free-2.0", "LicenseRef-Slint-Software-3.0"]
name = "slint"

[[licenses.exceptions]]
allow = ["GPL-3.0-only", "LicenseRef-Slint-Royalty-free-2.0", "LicenseRef-Slint-Software-3.0"]
name = "slint-build"

[[licenses.exceptions]]
allow = ["GPL-3.0-only", "LicenseRef-Slint-Royalty-free-2.0", "LicenseRef-Slint-Software-3.0"]
name = "slint-macros"

[[licenses.exceptions]]
allow = ["GPL-3.0-only", "LicenseRef-Slint-Royalty-free-2.0", "LicenseRef-Slint-Software-3.0"]
name = "i-slint-core"

[[licenses.exceptions]]
allow = ["GPL-3.0-only", "LicenseRef-Slint-Royalty-free-2.0", "LicenseRef-Slint-Software-3.0"]
name = "i-slint-core-macros"

[[licenses.exceptions]]
allow = ["GPL-3.0-only", "LicenseRef-Slint-Royalty-free-2.0", "LicenseRef-Slint-Software-3.0"]
name = "i-slint-common"

[[licenses.exceptions]]
allow = ["GPL-3.0-only", "LicenseRef-Slint-Royalty-free-2.0", "LicenseRef-Slint-Software-3.0"]
name = "i-slint-compiler"

[[licenses.exceptions]]
allow = ["GPL-3.0-only", "LicenseRef-Slint-Royalty-free-2.0", "LicenseRef-Slint-Software-3.0"]
name = "i-slint-backend-selector"

[[licenses.exceptions]]
allow = ["GPL-3.0-only", "LicenseRef-Slint-Royalty-free-2.0", "LicenseRef-Slint-Software-3.0"]
name = "i-slint-backend-winit"

[[licenses.exceptions]]
allow = ["GPL-3.0-only", "LicenseRef-Slint-Royalty-free-2.0", "LicenseRef-Slint-Software-3.0"]
name = "i-slint-renderer-femtovg"

[[licenses.exceptions]]
allow = ["GPL-3.0-only", "LicenseRef-Slint-Royalty-free-2.0", "LicenseRef-Slint-Software-3.0"]
name = "i-slint-renderer-skia"

[[licenses.exceptions]]
allow = ["GPL-3.0-only", "LicenseRef-Slint-Royalty-free-2.0", "LicenseRef-Slint-Software-3.0"]
name = "i-slint-renderer-software"

# Exception (#37): `rawler`'s bare "LGPL-2.1" is compatible with Nicti's AGPL-3.0-or-later per
# LGPL-2.1 §§5-6 (see the LGPL note above and docs/licensing.md's Flags §2 for the full citation
# trail) -- not blocked on an "or-later" grant the way an earlier draft of this file assumed. Kept
# as a per-crate exception rather than a global allowlist entry because cargo-deny can verify
# license *compatibility*, not whether a shipped build actually satisfies §6's own notice +
# source-availability packaging obligation -- that's a per-crate, per-shipping-decision check, not
# something a blanket "LGPL-2.1" allow entry could express. **Not actually path-scoped to
# `spikes/retina`** -- cargo-deny's `licenses.exceptions` matches by crate name across the whole
# resolved dependency graph, with no per-workspace-member mechanism (confirmed: a hostile review
# caught an earlier draft of this comment overclaiming path-scoping). If any other crate in this
# workspace ever adds `rawler` as a dependency, this exception silently covers that too -- that's
# fine on the compatibility question now, but re-check the §6 packaging obligation is actually
# satisfied wherever that dependency ships.
[[licenses.exceptions]]
allow = ["LGPL-2.1"]
name = "rawler"

# publish = false workspace crates carry no SPDX license (nicti, pawprint, whisker) -- this exempts
# them from the license check entirely rather than failing on our own unlicensed-by-design internal
# crates (verified: `cargo deny check licenses` passes with them Unlicensed and this set to true;
# flipping it to false reintroduces them as failures).
[licenses.private]
ignore = true

# No [advisories]/[bans]/[sources] sections: CI only ever runs `cargo deny check licenses` (see
# ci.yml), so config here would be dead weight -- worse, `[advisories] ignore = ["*"]` was tried
# and confirmed NOT to do what it looks like it does (that key ignores specific RUSTSEC/yanked
# IDs, not a wildcard "ignore everything"; "*" just matches nothing and is silently inert). If
# advisories/bans/sources scanning is added later, write real config for it then rather than
# leaving a misleading placeholder now.

[package]
name = "sniff"
version = "0.0.0"
edition = "2021"
publish = false
description = "Throwaway spike for #28: embedded-JPEG (NEF/DNG PreviewIFD) inventory and read/decode benchmark across Nikon bodies, feeding #29's preview-tier design. Not a production crate."

[[bin]]
name = "sniff"
path = "src/main.rs"

[dependencies]
zune-jpeg = "0.4"
fast_image_resize = "5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
csv = "1"
sha2 = "0.10"
clap = { version = "4", features = ["derive"] }
rayon = "1"
rand = "0.8"
thiserror = "2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Storage_FileSystem", "Win32_Foundation"] }

[dev-dependencies]
tempfile = "3"

[package]
name = "sniff"
version = "0.0.0"
edition = "2021"
license.workspace = true
publish = false
description = "Throwaway spike for #28: embedded-JPEG (NEF/DNG PreviewIFD) inventory and read/decode benchmark across Nikon bodies, feeding #29's preview-tier design. Not a production crate."

[[bin]]
name = "sniff"
path = "src/main.rs"

[dependencies]
zune-jpeg = "0.5"
fast_image_resize = "6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
csv = "1"
sha2 = "0.11"
clap = { version = "4", features = ["derive"] }
rayon = "1"
rand = "0.10"
thiserror = "2"
rusqlite = { version = "0.40", features = ["bundled"] }
jpeg-encoder = "0.6"
# AVIF candidate for #29's tier-payload-format comparison, at the user's request -- both are pure
# Rust (no C toolchain dependency, unlike `image`'s `avif-native`/`dav1d` decode path): `ravif`
# (rav1e-based encode) and `avif-decode` (rav1d-based decode + avif-parse container demux).
ravif = "0.13"
avif-decode = { version = "3", default-features = false }
rgb = "0.8"
imgref = "1"
# Lossy-WebP candidate for #143 (ADR-0029's deferred follow-up): unlike ravif/avif-decode above,
# this is a real C dependency (`libwebp-sys` vendors and compiles libwebp with `cc`) -- accepted
# here because `rusqlite`'s `bundled` feature already compiles C in this same crate, so it's not a
# new category of build requirement. `default-features = false` drops the optional `image` dep
# (only needed for `Encoder::from_image`/`DynamicImage` conversions this spike doesn't use).
webp = { version = "0.3", default-features = false }
# `nicti-prowl::golden::ssim` takes/returns `image::RgbImage` in its public signature, so this
# spike needs its own matching `image` dependency to name that type -- not re-exported by prowl.
image = { version = "0.25", default-features = false }
# Reuses `nicti-prowl`'s hand-rolled SSIM (`golden::ssim`) for #143's quality-vs-speed comparison
# instead of a second copy. Spike-depends-on-crate is an unusual direction, but the alternative is
# duplicating the same formula.
nicti-prowl = { path = "../../crates/nicti-prowl" }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Storage_FileSystem", "Win32_Foundation"] }

[dev-dependencies]
tempfile = "3"

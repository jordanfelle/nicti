[package]
name = "crouch"
version = "0.0.0"
edition = "2021"
license.workspace = true
publish = false
description = "Throwaway spike for #54 (ADR-0054): Pounce's job scheduler design -- a two-class (foreground/background) priority queue over chunked, cooperatively-cancellable jobs, an IS_EDITING preemption gate, token-bucket throttling, GPU/VRAM telemetry, and a real-hardware measurement of foreground (wgpu) preemption latency under background wgpu and ort/CUDA (SCUNet-tile) contention. Not a production crate -- see CLAUDE.md's package-map note on spikes/*."

[lib]
name = "crouch"
path = "src/lib.rs"

[[bin]]
name = "crouch"
path = "src/bin/crouch.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
clap = { version = "4", features = ["derive"] }
anyhow = "1"
wgpu = "30"
pollster = "1"
bytemuck = { version = "1", features = ["derive"] }
sysinfo = "0.37"
ort = { version = "2.0.0-rc.13", default-features = false, features = ["load-dynamic", "cuda", "tensorrt"] }
nicti-prowl = { path = "../../crates/nicti-prowl" }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Win32_Graphics_Dxgi", "Win32_Foundation"] }

[dev-dependencies]
tempfile = "3"

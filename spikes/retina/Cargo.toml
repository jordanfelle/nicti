[package]
name = "retina"
version = "0.0.0"
edition = "2021"
license.workspace = true
publish = false
description = "Throwaway spike for #37/#40: RAW decoder + demosaic/NR research. Compares LibRaw against rawler 0.8.0 across the full ref-10k set, a notify-based filesystem-watch spike for ingest (#24), and #40's classic-pipeline/Bayer-plane comparison tooling for spikes/rods. The LibRaw FFI/vendor submodule/build.rs itself was promoted to crates/nicti-decode in #41 -- this crate now depends on that one for its decode step instead of vendoring its own copy. Not a production crate -- see CLAUDE.md's package-map note on spikes/*."

[[bin]]
name = "retina"
path = "src/main.rs"

[dependencies]
nicti-decode = { path = "../../crates/nicti-decode" }
nicti-prowl = { path = "../../crates/nicti-prowl" }
rawler = "0.8"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
blake3 = "1"
rayon = "1"
anyhow = "1"
thiserror = "2"
notify = "8"
csv = "1"
# #38/calico hand-off: writes the linear demosaiced TIFF `dump-linear` produces.
image = { version = "0.25", default-features = false, features = ["tiff"] }

[dev-dependencies]
tempfile = "3"

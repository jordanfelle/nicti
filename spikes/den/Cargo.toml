[package]
name = "den"
version = "0.0.0"
edition = "2021"
publish = false
description = "Throwaway spike for #67: catalog-database-engine comparison (SQLite/WAL, DuckDB, LMDB) against docs/benchmarks.md's Library targets at 600k/2M synthetic scale. Embedded Postgres (pglite-rs/pglite-oxide) hard-gate-failed before a backend was worth writing — see ADR-0007. Not a production crate."

[[bin]]
name = "den"
path = "src/bin/den.rs"

[features]
default = ["sqlite", "duckdb"]
sqlite = ["dep:rusqlite"]
duckdb = ["dep:duckdb"]
lmdb = ["dep:heed", "dep:bincode"]

[dependencies]
rand = "0.8"
rand_distr = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
csv = "1"
clap = { version = "4", features = ["derive"] }
blake3 = "1"
thiserror = "2"
anyhow = "1"
tempfile = "3"
libc = "0.2"

rusqlite = { version = "0.40", features = ["bundled"], optional = true }
duckdb = { version = "1", features = ["bundled"], optional = true }
heed = { version = "0.22", optional = true }
bincode = { version = "1", optional = true }

[dev-dependencies]
tempfile = "3"

[package]
name = "pelt-egui"
version = "0.0.0"
edition = "2021"
license.workspace = true
publish = false
description = "Throwaway spike for #68 (ADR-0006): egui/eframe GUI-framework candidate -- virtualized 2M-cell grid, loupe next/prev, and a custom wgpu viewport (egui_wgpu::CallbackTrait) driving spikes/pelt's live-chain compute kernel, measured for input latency via bench/whisker per hero-scenario.md's method. Not a production crate."

[dependencies]
eframe = { version = "0.36", default-features = false, features = ["default_fonts", "wgpu", "wayland", "x11"] }
winit = { version = "0.30", default-features = false, features = ["default"] }
egui = "0.36"
egui-wgpu = "0.36"
wgpu = "30"
bytemuck = { version = "1", features = ["derive"] }
pelt = { path = "../pelt" }

[[bin]]
name = "pelt-egui"
path = "src/main.rs"

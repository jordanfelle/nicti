[package]
name = "loaf"
version = "0.0.0"
edition = "2021"
license.workspace = true
publish = false
description = "Throwaway spike for #44 (ADR-0044): Tapetum's stage-cached render graph -- a baked/live stage DAG with pawprint-style upstream-chained cache keys, byte-budgeted VRAM/RAM/disk cache tiers, crop as a geometry-only sample pass, a guided-filter preview-to-full-res mask refine (ported from spikes/siamese), directional N+-k bake prefetch, and a discrete-event simulation of the #43 hero scenario's bulk-sync bake queue. Not a production crate -- see CLAUDE.md's package-map note on spikes/*."

[lib]
name = "loaf"
path = "src/lib.rs"

[[bin]]
name = "loaf"
path = "src/bin/loaf.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
blake3 = "1"
wgpu = "30"
pollster = "1"
bytemuck = { version = "1", features = ["derive"] }
half = "2"
zstd = "0.13"
lz4_flex = "0.11"
thiserror = "2"
clap = { version = "4", features = ["derive"] }
anyhow = "1"
image = { version = "0.25", default-features = false, features = ["tiff"] }
nicti-prowl = { path = "../../crates/nicti-prowl" }

[dev-dependencies]
tempfile = "3"

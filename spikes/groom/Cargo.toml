[package]
name = "groom"
version = "0.0.0"
edition = "2021"
license.workspace = true
publish = false
description = "Throwaway spike for #50 (ADR-0050): classic clone/heal (CPU + wgpu Poisson-blend compute), auto-source-pick, ort/load-dynamic AI-removal scaffolding (MobileSAM/LaMa wrappers, no bundled weights), crop/resize/feather compositing, and the HealStage/Spot edit-model representation with a pawprint-style cache_key(). Not a production crate."

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
blake3 = "1"
wgpu = "30"
pollster = "1"
bytemuck = { version = "1", features = ["derive"] }
ort = { version = "2.0.0-rc.13", default-features = false, features = ["load-dynamic"] }
thiserror = "2"

# Dev-only, for tests/ort_cross_module.rs (#179): none of these four depend on groom, so this
# doesn't create a cycle. Reproduces the real cross-crate `ort` environment race that motivated
# #179's fix -- see that test file's own doc comment.
[dev-dependencies]
siamese = { path = "../siamese" }
crouch = { path = "../crouch" }
rods = { path = "../rods" }
litter = { path = "../litter" }

[[bin]]
name = "groom"
path = "src/bin/groom.rs"

[package]
name = "sheath"
version = "0.0.0"
edition = "2021"
publish = false
description = "Throwaway spike for #19 (ADR-0004): lazy module registry, C-ABI dylib loading with an ABI-version handshake, and a WASM-vs-native pixel-kernel timing comparison. Not a production crate."

[dependencies]
libloading = "0.9"

[dev-dependencies]
wasmtime = { version = "49", default-features = false, features = ["runtime", "cranelift", "wat"] }

[package]
name = "nicti-shed"
version = "0.0.0"
edition = "2021"
license.workspace = true
publish = false
build = "build.rs"
description = "The in-app updater (#249): checks GitHub Releases for a newer nicti version, minisign-verifies the downloaded installer against a compiled-in public key, and re-runs it silently (/S /UPDATE) -- never runs an unverified binary. Named after a cat shedding its old coat. Version-compare/asset-pick/minisign-verify logic is cross-platform and unit-tested on every CI platform; the actual network check + download + re-exec path is cfg(windows)-only, matching Nicti's Windows-only v1 target (ADR-0015)."

[dependencies]
semver = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
minisign-verify = "0.3"

# ureq's native-tls feature rides the OS trust store (Windows SChannel/CNG) rather than bundling
# webpki-roots, whose CDLA-Permissive-2.0 license isn't on deny.toml's allowlist (see
# docs/decisions/release.md) -- windows-only since that's the only platform this network path
# actually runs on (ADR-0015's v1 scope). default-features off drops ureq's own default `rustls`
# TLS backend (which would otherwise pull webpki-roots straight back in) plus its default `gzip`,
# neither of which this one-GET-plus-one-download use needs.
[target.'cfg(windows)'.dependencies]
ureq = { version = "3", default-features = false, features = ["native-tls"] }

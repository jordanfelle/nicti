[package]
name = "nicti-claw"
version = "0.0.0"
edition = "2021"
publish = false
description = "Module/plugin architecture (ADR-0004): the Module trait, a lazy OnceLock-backed registry, and a checked C-ABI dylib boundary with an ABI-version handshake. The load-bearing crate every nicti-* domain crate builds on."

[dependencies]
serde_json = "1"
libloading = "0.9"

[dev-dependencies]
wasmtime = { version = "49", default-features = false, features = ["runtime", "cranelift", "wat"] }

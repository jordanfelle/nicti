[package]
name = "nicti-calico"
version = "0.0.0"
edition = "2021"
license.workspace = true
publish = false
description = "Color management (#42/ADR-0042): output spaces, ICC profiles, display/proof transform, plus the ColorProfile extension point (ADR-0019 §8). DCP camera-profile parsing is #38's, promoted in a follow-up PR of #42."

[dependencies]
nicti-claw = { path = "../nicti-claw" }
moxcms = "0.9.1"
serde_json = "1"
thiserror = "2"
byteorder = "1"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_UI_ColorSystem"] }

[package]
name = "nicti-decode"
version = "0.0.0"
edition = "2021"
license.workspace = true
publish = false
description = "RAW decoder extension point (ADR-0019 §8) plus its real LibRaw-backed implementation (#41): vendors the same yogthos/LibRaw#nikon-he-decoder fork spikes/retina's own research used (git submodule at vendor/LibRaw, compiled via the cc crate, no bindgen -- see shim.h), promoted out of that spike in #41. #40's demosaic/NR algorithm choice still lives in spikes/rods; this crate settles decode + linear-camera-RGB extraction only."
build = "build.rs"

[dependencies]
nicti-claw = { path = "../nicti-claw" }
thiserror = "2"
clap = { version = "4", features = ["derive"] }
serde_json = "1"

[build-dependencies]
cc = "1"

[dev-dependencies]
tempfile = "3"

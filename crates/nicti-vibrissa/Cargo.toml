[package]
name = "nicti-vibrissa"
version = "0.0.0"
edition = "2021"
license.workspace = true
publish = false
description = "The agent control channel's client side (#649, ADR-0434 slice 3b): the shared wire pieces (handshake MAC, token file), a client for the tokened loopback socket, and `nicti-mcp`, a stdio MCP server that exposes the app's own command table as tools. Named for the whiskers a cat feels its surroundings with. No GUI and no async runtime."

[dependencies]
blake3 = "1"
getrandom = "0.4"
serde_json = "1"

[[bin]]
name = "nicti-mcp"
path = "src/bin/nicti-mcp.rs"

[package]
name = "nicti-pelt"
version = "0.0.0"
edition = "2021"
license.workspace = true
publish = false
description = "The production app shell (#241): one eframe/egui window sharing its wgpu device with crates/nicti-tapetum (ADR-0016's 'one shared device'), a Tapetum-rendered frame painted via egui_wgpu::CallbackTrait (ADR-0068), placeholder library/loupe/develop view routing, and a real nicti-lair SqliteCatalog. Named after the visible coat over the tapetum lucidum, matching this repo's feline naming convention -- not the nicti-ui name #241 was filed under."

[dependencies]
eframe = { version = "0.36", default-features = false, features = ["default_fonts", "wgpu", "wayland", "x11"] }
egui = "0.36"
egui-wgpu = "0.36"
wgpu = "30"
bytemuck = { version = "1", features = ["derive"] }
blake3 = "1"
semver = "1"
serde = "1"
serde_json = "1"
# JPEG-decodes a catalog asset's T0 embedded preview for the loupe's instant fallback while a real
# decode is still in flight (#31 phase 3) -- already in the workspace's resolved dependency graph
# via nicti-tapetum/nicti-prowl, so this is a new direct edge to an already-vetted crate, not a new
# dependency (no docs/licensing.md update needed per ADR-0018's amendment).
image = { version = "0.25", default-features = false, features = ["jpeg"] }
# f16 conversion for the display LUT texture upload (ADR-0042) -- already a nicti-tapetum dependency.
half = "2"
raw-window-handle = "0.6"
nicti-calico = { path = "../nicti-calico" }
nicti-tapetum = { path = "../nicti-tapetum" }
nicti-lair = { path = "../nicti-lair" }
nicti-stray = { path = "../nicti-stray" }
nicti-cornea = { path = "../nicti-cornea", features = ["libraw"] }
nicti-pounce = { path = "../nicti-pounce" }
nicti-shed = { path = "../nicti-shed" }
nicti-claw = { path = "../nicti-claw" }
nicti-pawprint = { path = "../nicti-pawprint" }
nicti-groom = { path = "../nicti-groom" }
nicti-siamese = { path = "../nicti-siamese" }
nicti-preen = { path = "../nicti-preen" }
thiserror = "2"
nicti-stalk = { path = "../nicti-stalk" }

[dev-dependencies]
tempfile = "3"
rusqlite = { version = "0.40", features = ["bundled"] }
# PNG decode for export round-trip assertions.
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }

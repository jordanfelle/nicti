[package]
name = "nicti-render"
version = "0.0.0"
edition = "2021"
license.workspace = true
publish = false
description = "Render stage extension point (ADR-0019 §8) plus Tapetum's (#44/#45) stage-cached render graph: a DAG of stage nodes with a blake3 cache key chained from upstream (graph.rs), byte-budgeted VRAM/RAM/disk cache tiers (cache.rs), and nearest-to-cursor bake prioritization (prefetch.rs), promoted from spikes/loaf. The render-stage execution signature (GPU buffer bindings) is still open, left to #45's own GPU slice."

[dependencies]
nicti-claw = { path = "../nicti-claw" }
nicti-pawprint = { path = "../nicti-pawprint" }
blake3 = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }

[dev-dependencies]
serde_json = "1"

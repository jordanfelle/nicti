[package]
name = "dewclaw"
version = "0.0.0"
edition = "2021"
license.workspace = true
publish = false
description = "Test fixture for nicti-claw's dylib tests: a toy stage compiled as a cdylib and loaded through nicti_claw::dylib's C-ABI vtable. Not a production module, not part of the shipping v1 target."

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
nicti-claw = { path = "../nicti-claw" }

[dev-dependencies]
serde_json = "1"

[features]
default = []
# Bakes in a deliberately wrong ABI version, for abi_handshake.rs's mismatch case.
bad-abi = []
# Omits the `claw_stage_vtable` export entirely, for abi_handshake.rs's missing-symbol case.
no-export = []
# Exports `claw_stage_vtable`, but it returns a null pointer, for abi_handshake.rs's
# null-vtable case (the symbol is present, but garbage/unusable).
null-vtable = []

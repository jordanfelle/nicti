[package]
name = "nicti-lair"
version = "0.0.0"
edition = "2021"
license.workspace = true
publish = false
description = "Catalog schema + import/ingest pipeline (#22, ADR-0019 §8): SQLite catalog store (ADR-0067/0103), volume/root/asset identity (ADR-0071), and the Scruff import pipeline that extracts T0 grid previews at import time (ADR-0029) without a RAW decode."

[dependencies]
nicti-claw = { path = "../nicti-claw" }
nicti-cornea = { path = "../nicti-cornea" }
nicti-pawprint = { path = "../nicti-pawprint" }
nicti-pounce = { path = "../nicti-pounce" }
nicti-scent = { path = "../nicti-scent" }
rusqlite = { workspace = true }
blake3 = "1"
kamadak-exif = "0.6"
walkdir = "2"
unicode-normalization = "0.1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
trash = "5"
# AVIF thumbnail sidecars (#393, ADR-0143): pure-Rust encode, container parse for validation
ravif = "0.13"
avif-parse = "2"
avif-decode = { version = "3", default-features = false }
image = { version = "0.25", default-features = false, features = ["jpeg"] }

[dev-dependencies]
tempfile = "3"

[package]
name = "nicti-cornea"
version = "0.0.0"
edition = "2021"
license.workspace = true
publish = false
description = "RAW decoder extension point (ADR-0019 §8) plus its real LibRaw-backed implementation (#41): vendors the same yogthos/LibRaw#nikon-he-decoder fork spikes/retina's own research used (git submodule at vendor/LibRaw, compiled via the cc crate, no bindgen -- see shim.h), promoted out of that spike in #41. #40's demosaic/NR algorithm choice still lives in spikes/rods; this crate settles decode + linear-camera-RGB extraction only. The `embedded` module (T0 preview extraction, #22) is pure Rust and always built -- nicti-lair depends on that alone, with the `libraw` feature off, so it never pays for the LibRaw C++ compile below."
build = "build.rs"

[features]
# Gates LibRawDecoder (and its LibRaw FFI calls) out of the default build -- nicti-lair depends
# on this crate for `embedded` alone and must never need `vendor/LibRaw` checked out or a C++
# compiler to build. retina (spikes/retina) and this crate's own `--all-features` CI job both
# enable it explicitly. See build.rs's own feature check for the other half of this gate.
libraw = ["dep:cc", "dep:clap"]
default = []

[dependencies]
nicti-claw = { path = "../nicti-claw" }
# JPEG sources (#576): ICC -> sRGB via calico's source transform, pixels via the `image` JPEG decoder.
nicti-calico = { path = "../nicti-calico" }
image = { version = "0.25", default-features = false, features = ["jpeg"] }
# Raw CMYK/YCCK samples for Adobe CMYK JPEGs (#681); `image` already pulls this decoder in.
zune-jpeg = "0.5"
thiserror = "2"
clap = { version = "4", features = ["derive"], optional = true }
serde_json = "1"
kamadak-exif = "0.6"

[build-dependencies]
cc = { version = "1", optional = true }

[dev-dependencies]
tempfile = "3"
# Encodes CMYK/YCCK and EXIF-tagged JPEGs for the decode tests (#652); already in the lockfile via nicti-preen.
jpeg-encoder = "0.7"
moxcms = "0.9.1"
# Parses the DNG lens opcodes in tests/real_dng.rs (#428); iris depends only on claw, so no cycle.
nicti-iris = { path = "../nicti-iris" }

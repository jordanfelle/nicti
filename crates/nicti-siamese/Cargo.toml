[package]
name = "nicti-siamese"
version = "0.0.0"
edition = "2021"
license.workspace = true
publish = false
description = "AI masks (#49, ADR-0048/ADR-0049), promoted from spikes/siamese: the segmentation providers (BiRefNet subject/background over ort/load-dynamic with its real tensor contract, and the interim sky heuristic) registered behind nicti-stalk's pluggable SegmentationProvider, the neutral model image every model runs on, and the Pounce GPU-lane MaskBakeJob. Named after the breed known for its dark face mask. Weights are never bundled -- see nicti-stalk's model store."

[dependencies]
blake3 = "1"
nicti-groom = { path = "../nicti-groom" }
nicti-haw = { path = "../nicti-haw" }
nicti-pounce = { path = "../nicti-pounce" }
nicti-stalk = { path = "../nicti-stalk" }
nicti-tapetum = { path = "../nicti-tapetum" }
nicti-claw = { path = "../nicti-claw" }
ort = { version = "2.0.0-rc.13", default-features = false, features = ["load-dynamic"] }
serde_json = "1"
thiserror = "2"

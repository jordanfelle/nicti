[package]
name = "nicti-tapetum"
version = "0.0.0"
edition = "2021"
license.workspace = true
publish = false
description = "Render stage extension point (ADR-0019 §8) plus Tapetum's (#44/#45) stage-cached render graph: a DAG of stage nodes with a blake3 cache key chained from upstream (graph.rs), byte-budgeted VRAM/RAM/disk cache tiers (cache.rs), nearest-to-cursor bake prioritization (prefetch.rs), a shared wgpu GpuContext (gpu.rs) and GPU-resident RGBA16F frame textures (frame.rs), the real RenderStage execution trait + graph-driven Renderer (renderer.rs), and the concrete decode/live-suffix/geometry stages wired to a real nicti-cornea LinearFrame (color.rs/geometry.rs/stages.rs)."

[dependencies]
nicti-calico = { path = "../nicti-calico" }
nicti-claw = { path = "../nicti-claw" }
nicti-cornea = { path = "../nicti-cornea" }
nicti-pawprint = { path = "../nicti-pawprint" }
blake3 = "1"
# Baked AI alpha disk tier (#353): deflate over the 8-bit alpha plane. Already in the tree via
# `nicti-calico`, so no new crate or licence row.
flate2 = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wgpu = "30"
pollster = "1"
bytemuck = { version = "1", features = ["derive"] }
half = "2"
# Auto-level (#47): downscale -> Canny edge detection -> Hough line transform -> median angle.
# `imageproc` covers both primitives without pulling in the full opencv-rust binding surface (see
# `docs/adr/0047-crop-straighten-autolevel.md` for the comparison) -- default features disabled
# since auto-level needs neither `text` (font rendering, `ab_glyph`) nor `fft` (`rustdct`) nor
# `rayon`; both licensed MIT, matching `deny.toml`'s existing allowlist with no new entry needed.
imageproc = { version = "0.27", default-features = false }
image = { version = "0.25", default-features = false }

[package]
name = "nicti-pawprint"
version = "0.0.0"
edition = "2021"
license.workspace = true
publish = false
description = "Non-destructive edit document (ADR-0021): EditDocument/StageEntry, canonical-JSON + blake3 stage hashing (the pawprint/loaf cache-key scheme generalized to Tapetum's DAG), and append-only edit history with slider-drag compaction. Promoted from spikes/pawprint (#21) and spikes/loaf's hash.rs (#44)."

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
blake3 = "1"
thiserror = "2"
uuid = { version = "1", features = ["v4", "serde"] }
